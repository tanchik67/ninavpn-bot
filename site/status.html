<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус сети — NinaVPN</title>
<meta name="description" content="Статус API и локаций NinaVPN.">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a class="brand" href="index.html"><img class="brand-mark" src="/assets/nina-wordmark.png" alt="NinaVPN" width="187" height="28"></a>
    <div class="links">
      <a href="how-we-work.html">Как работаем</a>
      <a href="guides.html">Гайды</a>
      <a href="en/status.html">EN</a>
    </div>
  </nav>
  <div class="badge">Status</div>
  <h1>Статус сети</h1>
  <p class="lead">Публичная страница здоровья сервиса. API: <code>/health</code> и <code>/api/v1/network/status</code>.</p>
  <div class="card" id="apiCard"><span class="muted">Проверяем API…</span></div>
  <div class="grid two" id="locs"></div>
  <footer>
    <a href="uptime.html">Uptime report</a>
    <a href="security.html">Security</a>
  </footer>
</div>
<script>
async function load() {
  const apiCard = document.getElementById('apiCard');
  const locs = document.getElementById('locs');
  try {
    const h = await fetch('/health', { cache: 'no-store' });
    const hj = await h.json();
    apiCard.innerHTML = h.ok
      ? `<span class="status-ok">● API ok</span> · ${hj.service || 'ninavpn-api'}`
      : `<span class="status-warn">● API degraded</span>`;
  } catch (e) {
    apiCard.innerHTML = `<span class="status-warn">● API unreachable from this browser</span>`;
  }
  try {
    const r = await fetch('/api/v1/network/locations', { cache: 'no-store' });
    if (!r.ok) throw new Error('fail');
    const data = await r.json();
    locs.innerHTML = data.map(l => `
      <div class="card">
        <div>${l.flag} <strong>${l.city}</strong></div>
        <div class="muted">${l.country} · ${l.region} · ${l.protocol}</div>
        <div class="status-ok">● ${l.status}</div>
      </div>`).join('');
  } catch (e) {
    locs.innerHTML = `<div class="card muted">Каталог локаций временно недоступен. Повторите позже.</div>`;
  }
}
load();
</script>
</body>
</html>
