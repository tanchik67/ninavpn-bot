## NINAVPN — nginx vhost for app.ninavpn.store (Expo web client)
##
## - Static SPA from /opt/ninavpn-bot/apps/client/dist
## - Cloudflare Flexible-safe :80 (same pattern as ninavpn.store)
## - Optional :443 if Let’s Encrypt cert exists
##
## DNS (Cloudflare):
##   A  app  →  2.27.122.201  (Proxied / orange cloud)
##
## Install:
##   sudo cp deploy/nginx/app.ninavpn.store.conf /etc/nginx/sites-available/app.ninavpn.store
##   sudo ln -sf /etc/nginx/sites-available/app.ninavpn.store /etc/nginx/sites-enabled/app.ninavpn.store
##   sudo nginx -t && sudo systemctl reload nginx
##
## Cert (after DNS propagates; optional with Flexible SSL):
##   sudo certbot --nginx -d app.ninavpn.store --non-interactive --agree-tos -m hssestandards@gmail.com --redirect || true

server {
    listen 80;
    listen [::]:80;
    # panel.ninavpn.store is an existing Cloudflare DNS alias pointing at the same origin
    server_name app.ninavpn.store panel.ninavpn.store;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    root /opt/ninavpn-bot/apps/client/dist;
    index index.html;

    # Cache hashed Expo bundles aggressively
    location ^~ /_expo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS on origin — enabled after certbot issues the cert.
# Cloudflare Flexible still talks HTTP to :80; Full/Strict needs this block.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ninavpn.store panel.ninavpn.store;

    # Uses app LE cert (panel cert was temporary before DNS rename)
    ssl_certificate     /etc/letsencrypt/live/app.ninavpn.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ninavpn.store/privkey.pem;

    root /opt/ninavpn-bot/apps/client/dist;
    index index.html;

    location ^~ /_expo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
